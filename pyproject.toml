[project]
name = "notestock-sentiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AmaseCocoa", email = "cocoa@amase.cc" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "fugashi>=1.5.2",
    "ipadic>=1.0.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "unidic-lite>=1.0.8",
]

[project.scripts]
notestock-sentiment = "notestock_sentiment:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
